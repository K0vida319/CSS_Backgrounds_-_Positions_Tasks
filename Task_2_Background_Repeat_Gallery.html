<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Repeat Gallery</title>
    <style>
        *
        {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

            font-family: 'Trebuchet MS';
            color: white;
        }
        h1
        {
            font-size: 50px;
            letter-spacing: 3px;
        }
        body
        {
            text-align: center;
            background-color: lightblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            margin: 20px;
        }
        .row-1 div, .row-2 div
        {
            border: 3px solid white;
            height: 300px;
            width: 300px;
        }
        .row-1
        {
            display: flex;
            gap: 50px;
            justify-content: center;
        }
        .row-2
        {
            display: flex;
            gap: 50px;
        }

        .row-1 .div-1
        {
            background: url(./image/PuppyImage.jpg) repeat;
            
            background-size: 75px;
        }
        .row-1 .div-2
        {
            background: url(./image/PuppyImage.jpg) repeat-x;
            background-size: 75px;
        }
        .row-1 .div-3
        {
            background: url(./image/PuppyImage.jpg) repeat-y;
            background-size: 75px;
        }
        .row-1 .div-4
        {
            background: url(./image/PuppyImage.jpg) no-repeat center;
            background-size: 75px;
        }
        .row-2 .div-1
        {
            background: url(./image/PuppyImage.jpg) round;
            background-size: 75px;
        }
        .row-2 .div-2
        {
            background: url(./image/PuppyImage.jpg) space;
            background-size: 60px;
        }
    </style>
</head>
<body>
    <h1>Background Repeat Gallery</h1>
    <div class="row-1">
        <div class="div-1"></div>
        
        <div class="div-2"></div>
        
        <div class="div-3"></div>
        
        <div class="div-4"></div>
    </div>
    
    <div class="row-2">
         <div class="div-1"></div>

        <div class="div-2"></div>
    </div>
</body>
</html>
