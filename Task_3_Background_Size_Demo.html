<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background Size Demo</title>
    <style>       
        *
        {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            background-color: lightblue;
            font-family: 'Trebuchet MS';
            color: white;
        }
        h1
        {
            text-align: center;
            font-size: 50px;
            letter-spacing: 3px;
            margin: 10px 0px;
        }
        
        body
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
        .div-1, .div-2
        {
            border: 5px solid white;
            width: 400px;
            height: 400px;
        }
        .row-1, .row-2
        {
            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .row-1 .div-1
        {
            background-image: url(./image/0b598fb4-5bbb-4ba4-b174-f4cec803797b.jpg);
            background-size: auto; 
        }
        .row-1 .div-2
        {
            background-image: url(./image/PuppyImage.jpg);
            background-size: contain;
        }
        .row-2 .div-1
        {
            background-image: url(./image/PuppyImage.jpg);
            background-size: cover;
        }
        .row-2 .div-2
        {
            background-image: url(./image/PuppyImage.jpg);
            background-size: 250px 180px;
        }
    </style>
</head>
<body>
    <h1>CSS Background Size Demo</h1>
    <div class="row-1">
        <div class="div-1"></div>
        <div class="div-2"></div>
    </div>
    <div class="row-2">
        <div class="div-1"></div>
        <div class="div-2"></div>
    </div>
</body>
</html>
